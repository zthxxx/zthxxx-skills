# Usage: https://taskfile.dev/usage/
# Schema Reference: https://taskfile.dev/reference/schema
# yaml-language-server: $schema=https://taskfile.dev/schema.json
---

version: 3

set: [pipefail]
shopt: [globstar]

vars:
  CLAUDE_DIR: '{{.HOME}}/.claude'

silent: false

tasks:
  default:
    silent: true
    cmds:
      - task --list-all

  update:
    desc: Install all commands and skills to global ~/.claude/ via hard link
    cmds:
      - task: update:commands
      - task: update:skills

  dev:sync-skills:
    desc: Sync skills to global Agent
    cmd: |
      skills add . --yes --global --agent codex --agent claude-code --skill \
        say-it-pro \
        tuning

